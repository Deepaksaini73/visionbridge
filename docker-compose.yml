version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7-jammy
    container_name: visionbridge-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  # Python AI & Computer Vision Microservice (Port 8001)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: visionbridge-ai
    restart: unless-stopped
    ports:
      - '8001:8001'
    environment:
      - AI_SERVICE_HOST=0.0.0.0
      - AI_SERVICE_PORT=8001
      - DEBUG=False
      - API_KEY=production-dev-key

  # Node.js Core API Backend (Port 5000)
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: visionbridge-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    depends_on:
      - mongodb
      - ai-service
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/visionbridge
      - JWT_SECRET=visionbridge_super_secure_jwt_secret_change_in_production
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:5173
      - AI_SERVICE_URL=http://ai-service:8001

volumes:
  mongo-data:
